<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Student Doc Capture</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Cropper.js CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <!-- SweetAlert2 Pop-up CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
    }
    html, body {
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .app-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      overflow: hidden;
      width: 100%;
      max-width: 480px;
      margin: auto;
    }
    .app-header {
      background: linear-gradient(45deg, #4e54c8, #8f94fb);
      color: white;
      padding: 16px;
      text-align: center;
    }
    
    /* Live Frame Container */
    .camera-frame-container {
      position: relative;
      margin: 0 auto 15px auto;
      overflow: hidden;
      border: 3px dashed #4e54c8;
      border-radius: 12px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Step 1: 3.5 x 4.5 Passport Ratio Frame */
    .passport-frame {
      width: 210px;
      height: 270px;
    }

    /* Step 2: Wide Signature Horizontal Strip Frame */
    .signature-frame {
      width: 300px;
      height: 100px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cropper Box Container */
    .crop-container {
      max-width: 100%;
      max-height: 320px;
      margin-bottom: 15px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .crop-container img {
      max-width: 100%;
      display: block;
    }

    .preview-img {
      border: 2px solid #ddd;
      border-radius: 8px;
      max-width: 100%;
      height: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .btn-material {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="app-card">
    <!-- Header -->
    <div class="app-header">
      <h5 class="m-0 fw-bold"><span class="material-icons align-middle me-1">assignment_ind</span> Doc Scanner Pro</h5>
      <small class="opacity-75">3.5 cm x 5.5 cm Overlapped Merge (&lt; 29 KB)</small>
    </div>

    <div class="p-3 p-sm-4">
      <!-- Roll Number Entry -->
      <div class="mb-3">
        <label class="form-label fw-bold text-secondary">Roll Number Entry</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><span class="material-icons text-primary">badge</span></span>
          <input type="text" id="rollNo" class="form-control form-control-lg fw-bold" placeholder="Enter Roll No." value="1001">
          <button class="btn btn-outline-primary" type="button" id="btnIncrement" title="Next Roll Number (+1)">
            <span class="material-icons align-middle">add</span>
          </button>
        </div>
      </div>

      <!-- Stepper Status Badge -->
      <div class="text-center mb-3">
        <span id="stepBadge" class="badge bg-primary px-3 py-2 fs-6 rounded-pill">Step 1: Passport Photo</span>
      </div>

      <!-- 1. Live Camera Viewfinder Section -->
      <div id="camSection" class="text-center">
        <div id="frameBox" class="camera-frame-container passport-frame">
          <video id="video" autoplay playsinline muted></video>
        </div>

        <p class="text-muted small fw-bold mb-3" id="frameGuideText">
          3.5 x 4.5 Passport Frame (Full Color Photo)
        </p>

        <div class="d-grid gap-2">
          <button id="captureBtn" class="btn btn-primary btn-lg btn-material py-2 fs-6">
            <span class="material-icons">photo_camera</span> Click Photo
          </button>
        </div>
        
        <div id="cameraErrorBox"></div>
      </div>

      <!-- 2. Interactive Cropping UI Section -->
      <div id="cropSection" class="text-center" style="display: none;">
        <p class="text-muted small fw-bold mb-2" id="cropGuideText">Adjust Cropping Box</p>
        <div class="crop-container">
          <img id="cropperImage" alt="Image to Crop">
        </div>

        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
          <button id="retakeBtn" class="btn btn-outline-danger btn-material">
            <span class="material-icons">refresh</span> Re-click
          </button>
          <button id="confirmCropBtn" class="btn btn-success btn-material">
            <span class="material-icons">crop</span> Crop & Proceed
          </button>
        </div>
      </div>

      <!-- 3. Final Combined Result & Upload Section -->
      <div id="resultContainer" class="text-center" style="display: none;">
        <h6 class="fw-bold text-success mb-2"><span class="material-icons align-middle">check_circle</span> Merged Preview (3.5cm x 5.5cm)</h6>
        
        <!-- Live File Size Badge -->
        <span id="fileSizeBadge" class="badge bg-dark text-white mb-2 px-3 py-1 fs-6">Size: Calculating...</span><br>
        
        <img id="finalImage" class="preview-img mb-3" alt="Final Combined Document"><br>
        
        <div class="d-grid gap-2">
          <button id="uploadBtn" class="btn btn-success btn-lg btn-material py-2 fs-6">
            <span class="material-icons">cloud_upload</span> Upload to Google Drive
          </button>
          <button id="resetAllBtn" class="btn btn-outline-secondary btn-material">
            <span class="material-icons">restart_alt</span> Reset & Start Over
          </button>
        </div>
        <p id="statusMsg" class="mt-3 fw-bold mb-0 small"></p>
      </div>

    </div>
  </div>
</div>

<!-- Cropper.js JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<!-- SweetAlert2 Pop-up JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  // Google Apps Script Web App Executable URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyi49UydSaJbCD3HE0U9usViBR6P8wlw9AjX0LWSPWvBqYzJQkRnHXtcsh9iA9t0BR1/exec";

  let currentStep = "photo";
  let cropper = null;
  let photoDataCanvas = null;
  let signDataCanvas = null;

  const video = document.getElementById('video');
  const frameBox = document.getElementById('frameBox');
  const captureBtn = document.getElementById('captureBtn');
  const stepBadge = document.getElementById('stepBadge');
  const camSection = document.getElementById('camSection');
  const cropSection = document.getElementById('cropSection');
  const cropperImage = document.getElementById('cropperImage');
  const confirmCropBtn = document.getElementById('confirmCropBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const resultContainer = document.getElementById('resultContainer');
  const finalImage = document.getElementById('finalImage');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusMsg = document.getElementById('statusMsg');
  const rollInput = document.getElementById('rollNo');
  const frameGuideText = document.getElementById('frameGuideText');
  const cropGuideText = document.getElementById('cropGuideText');
  const cameraErrorBox = document.getElementById('cameraErrorBox');
  const fileSizeBadge = document.getElementById('fileSizeBadge');

  // Start Live Camera
  function startCamera() {
    const constraints = { 
      video: { 
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      } 
    };

    navigator.mediaDevices.getUserMedia(constraints)
      .then(stream => {
        video.srcObject = stream;
        cameraErrorBox.innerHTML = "";
        captureBtn.disabled = false;
      })
      .catch(err => {
        console.error("Camera Access Error:", err);
        captureBtn.disabled = true;
        showPermissionHelp();
      });
  }

  function showPermissionHelp() {
    cameraErrorBox.innerHTML = `
      <div class="alert alert-danger text-start mt-3 p-2 small">
        <strong><span class="material-icons align-middle fs-6">videocam_off</span> Camera Permission Needed!</strong><br>
        Browser ke Address Bar me 🔒 Lock icon par tap karke Camera <b>ALLOW</b> karein aur Retry dabayein.
        <button onclick="startCamera()" class="btn btn-sm btn-danger w-100 mt-2">Retry Camera</button>
      </div>`;
  }

  startCamera();

  // Roll Number (+1) Increment
  document.getElementById('btnIncrement').addEventListener('click', () => {
    let currentVal = parseInt(rollInput.value);
    rollInput.value = !isNaN(currentVal) ? currentVal + 1 : "1001";
  });

  // Capture Photo and Initialize Cropper
  captureBtn.addEventListener('click', () => {
    if (!rollInput.value.trim()) {
      alert("Kripya Roll Number enter karein!");
      return;
    }

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = video.videoWidth || 1280;
    tempCanvas.height = video.videoHeight || 720;
    const ctx = tempCanvas.getContext('2d');
    ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

    cropperImage.src = tempCanvas.toDataURL('image/jpeg');

    camSection.style.display = "none";
    cropSection.style.display = "block";

    if (cropper) cropper.destroy();

    if (currentStep === "photo") {
      stepBadge.innerText = "Step 1: Crop Passport Photo (3.5 : 4.5 Ratio)";
      stepBadge.className = "badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill";
      cropGuideText.innerText = "Box ko adjust karke 3.5x4.5 Passport Photo crop karein:";

      cropper = new Cropper(cropperImage, {
        aspectRatio: 350 / 450,
        viewMode: 1,
        autoCropArea: 0.8,
        responsive: true
      });

    } else if (currentStep === "sign") {
      stepBadge.innerText = "Step 2: Crop Signature (Horizontal Strip Ratio)";
      stepBadge.className = "badge bg-info text-dark px-3 py-2 fs-6 rounded-pill";
      cropGuideText.innerText = "Box ko adjust karke Signature crop karein:";

      cropper = new Cropper(cropperImage, {
        aspectRatio: 350 / 100,
        viewMode: 1,
        autoCropArea: 0.8,
        responsive: true
      });
    }
  });

  // Confirm Crop Button Logic
  confirmCropBtn.addEventListener('click', () => {
    if (!cropper) return;

    if (currentStep === "photo") {
      photoDataCanvas = cropper.getCroppedCanvas({
        width: 350,
        height: 450
      });

      currentStep = "sign";
      cropper.destroy();
      cropper = null;

      cropSection.style.display = "none";
      camSection.style.display = "block";

      frameBox.className = "camera-frame-container signature-frame";
      frameGuideText.innerText = "Horizontal Strip Frame (Signature Capture)";
      captureBtn.innerHTML = '<span class="material-icons">draw</span> Click Signature';
      stepBadge.innerText = "Step 2: Click Signature";
      stepBadge.className = "badge bg-info text-dark px-3 py-2 fs-6 rounded-pill";

    } else if (currentStep === "sign") {
      let rawSignCanvas = cropper.getCroppedCanvas({
        width: 350,
        height: 100
      });

      signDataCanvas = applyBWFilter(rawSignCanvas, 350, 100);

      cropper.destroy();
      cropper = null;

      cropSection.style.display = "none";
      combineImages();
    }
  });

  // Retake Current Step
  retakeBtn.addEventListener('click', () => {
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
    cropSection.style.display = "none";
    camSection.style.display = "block";
  });

  // Apply B&W Filter for Signature
  function applyBWFilter(sourceCanvas, width, height) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(sourceCanvas, 0, 0, width, height);

    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
      let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
      
      if (avg > 135) { 
        data[i] = 255;
        data[i + 1] = 255;
        data[i + 2] = 255;
      } else {
        let darkVal = avg * 0.5;
        data[i] = darkVal;
        data[i + 1] = darkVal;
        data[i + 2] = darkVal;
      }
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  // Calculate Base64 String Byte Size in KB
  function getByteSizeKB(base64DataUrl) {
    const base64Str = base64DataUrl.split(',')[1];
    const bytes = (base64Str.length * 3) / 4;
    return (bytes / 1024).toFixed(1);
  }

  // Dynamic Image Compression Engine (< 28 KB target)
  function getCompressedJpegDataUrl(canvas, maxKB = 28) {
    let quality = 0.70;
    let dataUrl = canvas.toDataURL('image/jpeg', quality);
    
    while (getByteSizeKB(dataUrl) > maxKB && quality > 0.05) {
      quality -= 0.05;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }
    return dataUrl;
  }

  // Reset to Step 1 for Next Student
  function resetAppForNextStudent() {
    currentStep = "photo";
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
    resultContainer.style.display = "none";
    cropSection.style.display = "none";
    camSection.style.display = "block";

    frameBox.className = "camera-frame-container passport-frame";
    frameGuideText.innerText = "3.5 x 4.5 Passport Frame (Full Color Photo)";
    captureBtn.innerHTML = '<span class="material-icons">photo_camera</span> Click Photo';
    stepBadge.innerText = "Step 1: Passport Photo";
    stepBadge.className = "badge bg-primary px-3 py-2 fs-6 rounded-pill";
    statusMsg.innerText = "";
    uploadBtn.disabled = false;
  }

  document.getElementById('resetAllBtn').addEventListener('click', resetAppForNextStudent);

  // Combine Images into Exact 3.5cm x 5.5cm (350px x 550px) with Zero Gap / Direct Overlap
  function combineImages() {
    const finalCanvas = document.createElement('canvas');
    const ctx = finalCanvas.getContext('2d');

    const totalWidth = 350;
    const totalHeight = 550; 

    finalCanvas.width = totalWidth;
    finalCanvas.height = totalHeight;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, totalWidth, totalHeight);

    // Draw Passport Photo (Top)
    ctx.drawImage(photoDataCanvas, 0, 0, 350, 450);

    // Overlap Signature Strip directly on bottom (450px to 550px)
    ctx.drawImage(signDataCanvas, 0, 450, 350, 100);

    const compressedDataUrl = getCompressedJpegDataUrl(finalCanvas, 28);
    const finalKB = getByteSizeKB(compressedDataUrl);

    finalImage.src = compressedDataUrl;
    fileSizeBadge.innerText = `Size: ${finalKB} KB (< 29 KB) | Dim: 3.5cm x 5.5cm`;
    fileSizeBadge.className = finalKB < 29 ? "badge bg-success mb-2 px-3 py-1 fs-6" : "badge bg-danger mb-2 px-3 py-1 fs-6";

    resultContainer.style.display = 'block';
    stepBadge.innerText = "Step 3: Confirm & Upload";
    stepBadge.className = "badge bg-success px-3 py-2 fs-6 rounded-pill";
  }

  // Upload to Google Drive & Trigger SweetAlert2 Pop-up
  uploadBtn.addEventListener('click', () => {
    const rollNo = rollInput.value.trim();
    const imageData = finalImage.src;

    statusMsg.style.color = "#0d6efd";
    statusMsg.innerText = "Uploading to Google Drive...";
    uploadBtn.disabled = true;

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ rollNo: rollNo, image: imageData })
    })
    .then(res => res.json())
    .then(data => {
      uploadBtn.disabled = false;
      statusMsg.innerText = "";

      if (data.status === "success") {
        let sizeInfo = data.sizeKB ? data.sizeKB + " KB" : getByteSizeKB(imageData) + " KB";
        let uploadedFileName = rollNo + ".jpg";

        // Success Pop-up Box
        Swal.fire({
          title: "<strong>Upload Successful!</strong>",
          icon: "success",
          html: `
            <div class="text-start fs-6">
              <p class="mb-1"><b>File Name:</b> <span class="text-primary">${uploadedFileName}</span></p>
              <p class="mb-1"><b>File Size:</b> <span class="badge bg-success">${sizeInfo}</span></p>
              <p class="mb-0"><b>Status:</b> Saved in Google Drive Folder</p>
            </div>
          `,
          confirmButtonText: '<span class="material-icons align-middle me-1">check_circle</span> OK / Next Student',
          confirmButtonColor: "#198754",
          allowOutsideClick: false
        }).then((result) => {
          if (result.isConfirmed) {
            // Roll Number (+1) Increment
            let currentVal = parseInt(rollInput.value);
            if (!isNaN(currentVal)) {
              rollInput.value = currentVal + 1;
            }
            // Auto Reset App for Next Student
            resetAppForNextStudent();
          }
        });

      } else {
        Swal.fire({
          icon: 'error',
          title: 'Upload Failed',
          text: data.message || 'Unknown server error.'
        });
      }
    })
    .catch(err => {
      uploadBtn.disabled = false;
      statusMsg.innerText = "";
      Swal.fire({
        icon: 'error',
        title: 'Network Error',
        text: err.toString()
      });
    });
  });
</script>

</body>
</html>
